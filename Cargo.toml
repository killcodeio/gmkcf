[package]
name = "gmkcf"
version = "0.0.0"
edition = "2024"
author = "Krishna Kushwaha"

[dependencies]
actix-web = "4.5.1"
actix-multipart = "0.7.2"
futures-util = "0.3.30"
tokio = { version = "1.36.0", features = ["full"] }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.114"
anyhow = "1.0.80"
thiserror = "1.0.57"
env_logger = "0.11.3"
log = "0.4.21"

# Crypto
chacha20poly1305 = "0.10.1"
x25519-dalek = { version = "2.0.1", features = ["static_secrets", "serde"] }
rand = "0.8.5"
hex = "0.4.3"
base64 = "0.22.0"

# Binary Format
byteorder = "1.5.0"
